<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARSe QRIS Converter</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --ink: #000000;
      --paper: #ffffff;
      --bg: #2C3A47;
      --blue: #4d7cff;
      --pink: #FFC312;
      --mint: #5eead4;
      --shadow: 6px 6px 0 var(--ink);
      --shadow-sm: 4px 4px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(var(--ink) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      color: var(--ink);
      font-family: "Space Grotesk", Arial, sans-serif;
      font-weight: 500;
    }

    .container {
      max-width: 620px;
      margin: 30px auto;
      padding: 28px;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 0;
      box-shadow: 10px 10px 0 var(--ink);
    }

    h1 {
      display: inline-block;
      margin: 0 0 18px;
      padding: 6px 14px;
      background: var(--pink);
      border: 4px solid var(--ink);
      box-shadow: var(--shadow-sm);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      transform: rotate(-1.5deg);
    }

    h2 {
      display: inline-block;
      margin: 0 0 14px;
      padding: 4px 12px;
      background: var(--mint);
      border: 3px solid var(--ink);
      font-size: 18px;
      font-weight: 700;
    }

    .desc {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-size: 15px;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      font-family: "Space Mono", monospace;
      font-size: 14px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      overflow-wrap: anywhere;
    }

    input:focus, textarea:focus {
      outline: none;
      box-shadow: 4px 4px 0 var(--ink);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 4px solid var(--ink);
      border-radius: 0;
      background: var(--blue);
      color: var(--paper);
      box-shadow: var(--shadow);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 var(--ink);
    }

    button:active {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--ink);
    }

    button:focus-visible,
    summary:focus-visible {
      outline: 4px solid var(--pink);
      outline-offset: 3px;
    }

    button:disabled {
      background: #d4d4d4;
      color: #555;
      cursor: not-allowed;
      transform: none;
      box-shadow: var(--shadow-sm);
    }

    #submitBtn:disabled {
      cursor: wait;
    }

    button.secondary {
      background: var(--mint);
      color: var(--ink);
    }

    button.secondary:disabled {
      background: #d4d4d4;
      color: #555;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #fff7c2;
      border: 4px solid var(--ink);
      box-shadow: var(--shadow);
      text-align: center;
    }

    #status {
      margin: 0;
      padding: 10px 12px;
      background: var(--paper);
      border: 3px solid var(--ink);
      font-size: 14px;
      line-height: 1.6;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 22px auto;
      min-height: 0;
    }

    #qrcode canvas,
    #qrcode img {
      max-width: 100%;
      height: auto;
      padding: 10px;
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: var(--shadow);
    }

    pre {
      margin: 12px 0 0;
      padding: 12px;
      background: var(--ink);
      color: var(--mint);
      border: 3px solid var(--ink);
      font-family: "Space Mono", monospace;
      font-size: 12px;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    details {
      margin-top: 22px;
      text-align: left;
    }

    summary {
      display: inline-block;
      padding: 6px 12px;
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      font-weight: 700;
      cursor: pointer;
    }

    .note {
      margin: 26px 0 0;
      padding: 12px;
      border: 3px dashed var(--ink);
      font-family: "Space Mono", monospace;
      font-size: 12px;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px;
        box-shadow: 6px 6px 0 var(--ink);
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>QRIS Converter</h1>

    <p class="desc">
      Konversi QRIS berdasarkan nominal pembayaran.
      Tanpa biaya tambahan.
    </p>

    <form id="qrisForm">
      <label for="qris">Payload QRIS</label>
      <textarea id="qris" required spellcheck="false" placeholder="Masukkan payload QRIS..."></textarea>

      <label for="amount">Nominal pembayaran (Rp)</label>
      <input id="amount" type="number" min="1" step="1" value="25000" required >

      <button type="submit" id="submitBtn">Konversi & Buat QR Code</button>
    </form>

    <section id="result" class="result hidden">
      <h2>QRIS Hasil Konversi</h2>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="qrcode"></div>
      <button
        type="button"
        class="secondary"
        id="downloadBtn" disabled>
        Download QR Code PNG
      </button>

      <details>
        <summary>Detail respons API</summary>
        <pre id="response"></pre>
      </details>
    </section>

    <p class="note">
      Endpoint: nusakit.my.id<br>
      Metode: POST<br>
    </p>
  </main>

  <script>
    const API_URL =
      "https://nusakit.my.id/v1/qris/convert";

    const form = document.getElementById("qrisForm");
    const submitBtn = document.getElementById("submitBtn");
    const result = document.getElementById("result");
    const statusEl = document.getElementById("status");
    const qrContainer = document.getElementById("qrcode");
    const responseEl = document.getElementById("response");
    const downloadBtn = document.getElementById("downloadBtn");

    let currentQR = "";

    function findQR(data, depth = 0) {
      if (depth > 6 || data == null) return "";

      if (typeof data === "string") {
        const value = data.trim();

        try {
          const parsed = JSON.parse(value);
          return findQR(parsed, depth + 1);
        } catch {}

        return /^000201/.test(value) && value.length > 20
          ? value
          : "";
      }

      if (typeof data !== "object") return "";

      const keys = [
        "qris",
        "qrString",
        "qr_string",
        "qrPayload",
        "qr_payload",
        "payload",
        "qrCode",
        "qr_code",
        "data"
      ];

      for (const key of keys) {
        if (data[key] !== undefined) {
          const found = findQR(data[key], depth + 1);
          if (found) return found;
        }
      }

      return "";
    }

    function createQR(payload) {
      if (typeof QRCode === "undefined") {
        throw new Error(
          "Library QR Code gagal dimuat. Periksa koneksi internet."
        );
      }

      qrContainer.replaceChildren();

      new QRCode(qrContainer, {
        text: payload,
        width: 280,
        height: 280,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      currentQR = payload;
      downloadBtn.disabled = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const qris = document
        .getElementById("qris")
        .value.trim();

      const amount = Number(
        document.getElementById("amount").value
      );

      if (!qris || !Number.isSafeInteger(amount) || amount <= 0) {
        alert("Masukkan payload QRIS dan nominal yang valid.");
        return;
      }

      // Tidak mengirim feeType atau feeValue.
      const payload = {
        qris: qris,
        amount: amount
      };

      result.classList.remove("hidden");
      qrContainer.replaceChildren();
      responseEl.textContent = "";
      statusEl.textContent = "Menghubungi API...";
      currentQR = "";
      downloadBtn.disabled = true;

      submitBtn.disabled = true;
      submitBtn.textContent = "Memproses...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const rawText = await response.text();

        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          data = rawText;
        }

        responseEl.textContent =
          typeof data === "string"
            ? data
            : JSON.stringify(data, null, 2);

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}: ${rawText.slice(0, 300)}`
          );
        }

        const convertedQR = findQR(data);

        if (!convertedQR) {
          statusEl.textContent =
            "Request berhasil mendapat respons, tetapi payload " +
            "QRIS hasil konversi tidak ditemukan. Periksa detail " +
            "respons API untuk mengetahui format datanya.";
          return;
        }

        createQR(convertedQR);

        statusEl.textContent =
          "QR Code berhasil dibuat dari payload hasil API.";

      } catch (error) {
        statusEl.textContent =
          "Gagal membuat QR Code.\n" +
          error.message +
          "\n\nJika muncul Failed to fetch, periksa koneksi, " +
          "ketersediaan API, dan konfigurasi CORS.";

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Konversi & Buat QR Code";
      }
    });

    downloadBtn.addEventListener("click", () => {
      if (!currentQR) return;

      const canvas = qrContainer.querySelector("canvas");

      if (!canvas) {
        alert("QR Code belum siap diunduh.");
        return;
      }

      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "qris-converted.png";
      link.click();
    });
  </script>
</body>
</html>
